services:
  - type: web
    name: grid-digital-twin-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: ENV
        value: production
      - key: CORS_ORIGINS
        value: "*"
